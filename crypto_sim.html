<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto & Interception Simulator v2</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;     
            --warning: #f59e0b;    
            --success: #10b981;    
            --hacker-bg: #000000;
            --hacker-text: #22c55e;
            --wire-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .header {
            width: 100%;
            max-width: 1000px;
            background: var(--panel-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header-title h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .header-title p { font-size: 0.85rem; color: var(--text-muted); }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .input-group label {
            font-size: 0.85rem; 
            color: var(--text-muted);
            font-weight: 600;
        }

        input[type="text"], select, button {
            padding: 0.6rem 1rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus { border-color: var(--warning); }
        input[type="text"]:disabled { opacity: 0.6; cursor: not-allowed; }

        button { 
            background-color: #3b82f6; 
            border: none; 
            font-weight: bold; 
            cursor: pointer;
            padding: 0.6rem 2rem;
        }
        button:hover:not(:disabled) { filter: brightness(1.1); }
        button:disabled { background-color: #475569; cursor: not-allowed; }

        .simulation-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .network-stage {
            background: var(--panel-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            height: 350px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            overflow: hidden;
        }

        .node {
            width: 100px;
            height: 120px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            position: relative;
        }

        .node-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .node-label { font-weight: bold; font-size: 0.9rem; text-align: center; }

        .node.hacker {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-color: var(--danger);
            height: 100px;
            width: 120px;
        }

        .wire-main {
            position: absolute;
            left: 140px;
            right: 140px;
            top: 50%;
            height: 2px;
            background: var(--wire-color);
            z-index: 1;
        }

        .wire-sniff {
            position: absolute;
            left: 50%;
            top: 50%;
            bottom: 120px;
            width: 2px;
            background: var(--wire-color);
            z-index: 1;
            border-left: 2px dashed var(--danger);
        }

        .data-packet {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 6px 12px;
            border-radius: 4px;
            color: white;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: left linear, top linear;
            white-space: nowrap;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .data-packet svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

        .hacker-terminal {
            background: var(--hacker-bg);
            border: 1px solid var(--danger);
            border-radius: 8px;
            height: 280px;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            color: var(--hacker-text);
            box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.2);
            line-height: 1.5;
        }

        .log-line { margin-bottom: 6px; }
        .log-sys { color: #a1a1aa; }
        .log-alert { color: var(--warning); }
        .log-success { color: var(--danger); font-weight: bold; } 
        .log-fail { color: var(--success); } 

    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>Simulador de Criptografia & Interceptação</h1>
            <p>Demonstração de ataques Man-in-the-Middle e quebra de cifras</p>
        </div>
        
        <div class="controls-row">
            <div class="input-group">
                <label for="customPayload">Dado sensível a ser enviado:</label>
                <input type="text" id="customPayload" placeholder="Ex: CPF, Senha, Cartão de Crédito..." value="Senha123!Admin">
            </div>

            <div class="input-group">
                <label for="securityLevel">Camada de Segurança:</label>
                <select id="securityLevel">
                    <option value="none">1. Texto Claro (Sem Criptografia - HTTP)</option>
                    <option value="weak">2. Criptografia Fraca (Obsoleta - DES/WEP)</option>
                    <option value="strong">3. Criptografia Forte (Atual - AES-256 GCM)</option>
                </select>
            </div>

            <button id="btnSend">Simular Tráfego</button>
        </div>
    </div>

    <div class="simulation-container">
        <div class="network-stage" id="networkStage">
            <div class="wire-main" id="wireMain"></div>
            <div class="wire-sniff"></div>

            <div class="node" id="clientNode">
                <div class="node-icon">👤</div>
                <div class="node-label">Vítima</div>
            </div>

            <div class="node hacker" id="hackerNode">
                <div class="node-icon">🥷</div>
                <div class="node-label">Atacante (MitM)</div>
            </div>

            <div class="node" id="serverNode">
                <div class="node-icon">🏢</div>
                <div class="node-label">Servidor Bco</div>
            </div>
        </div>

        <div class="hacker-terminal" id="terminal">
            <div class="log-line log-sys">root@kali:~# msfconsole -q</div>
            <div class="log-line log-sys">[*] Starting network sniffer on interface eth0...</div>
            <div class="log-line log-sys">[*] Waiting for victim traffic...</div>
        </div>
    </div>

    <script>
        const btnSend = document.getElementById('btnSend');
        const securitySelect = document.getElementById('securityLevel');
        const customPayloadInput = document.getElementById('customPayload');
        const networkStage = document.getElementById('networkStage');
        const terminal = document.getElementById('terminal');
        
        const iconUnlocked = `<svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/></svg>`;
        const iconLocked = `<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>`;

        let isAnimating = false;
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function log(msg, type = '') {
            const div = document.createElement('div');
            div.className = `log-line ${type}`;
            // Previne injeção de HTML acidental caso o aluno digite tags, tratando apenas texto puro
            div.textContent = msg; 
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function createPacket(text, color, icon, duration, startX, endX, isClone = false) {
            return new Promise(resolve => {
                const packet = document.createElement('div');
                packet.className = 'data-packet';
                packet.style.backgroundColor = color;
                
                // Criação segura de elementos para evitar XSS caso testem payloads HTML
                packet.innerHTML = icon;
                const span = document.createElement('span');
                span.textContent = text;
                packet.appendChild(span);

                packet.style.left = `${startX}px`;
                
                if (isClone) {
                    packet.style.top = '50%';
                    packet.style.transitionDuration = `${duration}ms`;
                    networkStage.appendChild(packet);
                    void packet.offsetWidth;
                    packet.style.top = '220px'; 
                } else {
                    packet.style.transitionDuration = `${duration}ms`;
                    networkStage.appendChild(packet);
                    void packet.offsetWidth;
                    packet.style.left = `${endX}px`;
                }

                setTimeout(() => {
                    packet.remove();
                    resolve();
                }, duration);
            });
        }

        async function simulateTraffic() {
            if (isAnimating) return;
            
            const userPayload = customPayloadInput.value.trim() || "[DADO_VAZIO]";
            
            isAnimating = true;
            btnSend.disabled = true;
            securitySelect.disabled = true;
            customPayloadInput.disabled = true; // Bloqueia o input durante a animação

            const mode = securitySelect.value;
            const startX = 110;
            const endX = networkStage.offsetWidth - 140;
            const middleX = networkStage.offsetWidth / 2 - 40;
            const duration = 2000; 
            
            let packetText, packetColor, packetIcon;
            
            if (mode === 'none') {
                packetText = userPayload; // Mostra o texto real trafegando
                packetColor = 'var(--danger)';
                packetIcon = iconUnlocked;
            } else if (mode === 'weak') {
                packetText = '0x5F3A... (DES)';
                packetColor = 'var(--warning)';
                packetIcon = iconLocked;
            } else {
                packetText = '0x9A7B... (AES-256)';
                packetColor = 'var(--success)';
                packetIcon = iconLocked;
            }

            log('\n[*] Capturing new packet on wire...', 'log-sys');

            const packet = document.createElement('div');
            packet.className = 'data-packet';
            packet.style.backgroundColor = packetColor;
            
            packet.innerHTML = packetIcon;
            const spanText = document.createElement('span');
            spanText.textContent = packetText;
            packet.appendChild(spanText);
            
            packet.style.left = `${startX}px`;
            packet.style.transitionDuration = `${duration}ms`;
            networkStage.appendChild(packet);
            
            void packet.offsetWidth;
            packet.style.left = `${endX}px`;

            setTimeout(() => {
                createPacket(packetText, packetColor, packetIcon, 800, middleX, middleX, true);
                
                if (mode === 'none') {
                    log('[!] Plaintext traffic detected on port 80 (HTTP).', 'log-alert');
                    setTimeout(() => {
                        log('[+] Payload extracted directly from wire:', 'log-success');
                        log(`    => VAZOU: ${userPayload}`, 'log-success');
                    }, 500);
                } 
                else if (mode === 'weak') {
                    log('[!] Intercepted encrypted traffic (Detected: DES cipher / 56-bit).', 'log-alert');
                    setTimeout(() => {
                        log('[*] Cipher is obsolete. Launching brute force cracking module...', 'log-sys');
                    }, 600);
                    setTimeout(() => {
                        log('[*] Testing keyspace: 10%... 45%... 89%...', 'log-sys');
                    }, 1400);
                    setTimeout(() => {
                        log('[+] CRACK SUCCESSFUL (Time: 1.2s)! Key collision found.', 'log-success');
                        log(`    => Decrypted Payload: ${userPayload}`, 'log-success');
                    }, 2400);
                } 
                else if (mode === 'strong') {
                    log('[!] Intercepted encrypted traffic (Detected: TLS 1.3 / AES-256 GCM).', 'log-sys');
                    setTimeout(() => {
                        log('[*] Attempting standard decryption techniques...', 'log-alert');
                    }, 800);
                    setTimeout(() => {
                        log('[*] Key exchange uses Perfect Forward Secrecy (ECDHE).', 'log-sys');
                        log('[-] ERROR: Insufficient compute power. Brute force failed.', 'log-fail');
                        log('[-] Estimated time to crack: 3.3 x 10^43 years.', 'log-fail');
                        log('[-] Payload remains secure. Discarding garbage data.', 'log-fail');
                    }, 1800);
                }

            }, duration / 2); 

            setTimeout(() => {
                packet.remove();
                if(mode !== 'weak' && mode !== 'strong') {
                     resetControls();
                } else if (mode === 'weak'){
                    setTimeout(resetControls, 2400); 
                } else {
                    setTimeout(resetControls, 1800); 
                }
            }, duration);
        }
        
        function resetControls() {
            isAnimating = false;
            btnSend.disabled = false;
            securitySelect.disabled = false;
            customPayloadInput.disabled = false;
        }

        btnSend.addEventListener('click', simulateTraffic);

    </script>
</body>
</html>
